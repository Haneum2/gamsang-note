# Render Blueprint: 저장소를 연결하면 이 파일대로 웹 서비스를 만든다.
services:
  - type: web
    name: gamsang-note
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/genres
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: TURSO_JDBC_URL
        sync: false        # 값은 Render 화면에서 직접 입력 (파일에 쓰지 않는다)
      - key: TURSO_AUTH_TOKEN
        sync: false
